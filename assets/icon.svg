<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- App icon background: rounded square, deep charcoal -->
  <rect width="200" height="200" rx="44" fill="#1C1917"/>

  <!-- Sunrise mark: 3 rays -->
  <line x1="100" y1="128" x2="100" y2="102" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="128" x2="72"  y2="108" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="128" x2="128" y2="108" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>

  <!-- Sunrise arc: semicircle -->
  <path d="M 64 128 A 36 36 0 0 1 136 128" stroke="#D97706" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Horizon line with gap (broken horizon = breaking free) -->
  <line x1="48"  y1="128" x2="84"  y2="128" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  <line x1="116" y1="128" x2="152" y2="128" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
</svg>
