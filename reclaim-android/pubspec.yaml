name: reclaim
description: "Reclaim — Block Shorts, Reels & TikTok. Reclaim your focus."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (alpha)
  flutter_riverpod: ^2.4.9

  # Local storage
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.2.0

  # UI & animations
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
