name: focuslock
description: "FocusLock — Block Shorts, Reels & TikTok. Reclaim your focus."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.3
  cloud_firestore: ^4.15.3
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.5
  firebase_remote_config: ^4.3.11
  firebase_app_check: ^0.2.1+13

  # Navigation
  go_router: ^13.2.0

  # Charts
  fl_chart: ^0.67.0

  # UI & animations
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.0

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf  weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf weight: 600
        - asset: assets/fonts/Inter-Bold.ttf     weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf weight: 800
